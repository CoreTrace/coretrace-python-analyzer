[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coretrace-python-analyzer"
version = "0.1.0"
description = "Static security analysis infrastructure for Python code"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "CoreTrace" }]
keywords = ["static-analysis", "security", "taint", "sast", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CoreTrace/coretrace-python-analyzer"
Repository = "https://github.com/CoreTrace/coretrace-python-analyzer"
Issues = "https://github.com/CoreTrace/coretrace-python-analyzer/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.9",
  "twine>=5.0",
]

[project.scripts]
coretrace-python-analyzer = "coretrace_python.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coretrace_python"]

[tool.pytest.ini_options]
addopts = "-q -m 'not regression'"
markers = [
  "regression: analyses the pinned public repositories of tests/regression (network, slow)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["coretrace_python"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# Bundled plugins are loaded by path, not imported as modules.
exclude = ["src/coretrace_python/bundled/"]
