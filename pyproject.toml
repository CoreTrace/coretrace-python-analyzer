[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "coretrace-python-analyzer"
version = "0.1.0"
description = "Static security analysis infrastructure for Python code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CoreTrace" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
coretrace-python-analyzer = "coretrace_python.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coretrace_python"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["coretrace_python"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
