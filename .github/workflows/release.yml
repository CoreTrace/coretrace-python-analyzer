name: Release

# Publishes the package to PyPI when a version tag is pushed (``v0.1.0``). The tag must
# match the version in pyproject.toml. Publication uses PyPI trusted publishing: the
# ``pypi`` environment and the trusted publisher for this repository and workflow must be
# configured on pypi.org once; no token is stored.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

      # Lets the platform repin itself: coretrace-runner re-resolves this package's newest
      # version on PyPI and opens a pull request for the bump, for both python-analyzer and
      # python-analyzer-pro. Best effort, and never fails the release: the pull request can
      # also be started by hand from that repository's Actions tab. The payload is a hint;
      # the version is resolved there, not taken from here.
      - name: Notify coretrace-runner of the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RUNNER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "no RUNNER_DISPATCH_TOKEN set, skipping"; exit 0; }
          gh api repos/CoreTrace-Entreprise/coretrace-runner/dispatches \
            -f event_type=tool-release \
            -F client_payload[tool]=python-analyzer
